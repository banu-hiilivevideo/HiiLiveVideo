
name: Build HiiLiveVideo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Capacitor project
        run: |
          mkdir -p mobile/www
          rsync -av --exclude='.git' --exclude='.github' --exclude='mobile' ./ mobile/www/
          cd mobile
          cp www/HiiLiveVideo-Firebase-Login.html www/index.html

          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init HiiLiveVideo com.hiilivevideo.app --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Get SHA1 Fingerprint
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew signingReport | tee signing-report.txt

          SHA1="$(awk '/Variant: debug/{found=1} found && /SHA1:/{print $2; exit}' signing-report.txt)"

          if [ -z "$SHA1" ]; then
            echo "SHA1 fingerprint not found"
            exit 1
          fi

          echo "## Android Debug SHA-1" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$SHA1\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HiiLiveVideo-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
